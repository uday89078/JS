  <body>
    <script>
      function checkNumber(num) {
        if (num >= 10 && num <= 20) {
          console.log(num + " is between 10 and 20.");
        } else {
          console.log(num + " is not between 10 and 20.");
        }
      }
    </script>
  </body>
